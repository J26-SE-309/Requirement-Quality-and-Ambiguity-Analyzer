name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install ML engine
        run: pip install -e ".[dev]"
        working-directory: ml-engine
      - name: Lint
        run: ruff check .
      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm
      - name: Test
        run: pytest

  ml-engine:
    name: ML engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-engine
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-engine/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm
      - name: Test
        run: pytest
