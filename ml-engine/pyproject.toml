[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quality-ml"
version = "0.1.0"
description = "Requirement Quality and Ambiguity Analyzer: datasets, model training and evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/quality_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
