[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quality-ml"
version = "0.1.0"
description = "Requirement Quality and Ambiguity Analyzer: datasets, model training and evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "spacy>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = [
  "torch>=2.0",
  "transformers>=5.0",
  "accelerate>=1.0",
  "sentencepiece>=0.2",
  "protobuf>=5.0",
  "scikit-learn>=1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quality_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
